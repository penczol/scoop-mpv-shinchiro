name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Run every four hours, away from the top of the hour.
    - cron: '23 */4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
          THROW_ERROR: 1
      - name: Verify Scoop checkver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopHome = [Environment]::GetEnvironmentVariable('SCOOP_HOME', 'User')
          if ([string]::IsNullOrWhiteSpace($scoopHome)) {
              throw 'SCOOP_HOME was not configured by the Excavator action.'
          }

          $checkver = Join-Path $scoopHome 'bin\checkver.ps1'
          if (-not (Test-Path -LiteralPath $checkver)) {
              throw "Scoop checkver was not found at $checkver."
          }

          $bucket = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $manifest = Get-Content (Join-Path $bucket 'mpv-shinchiro-git.json') -Raw | ConvertFrom-Json
          $output = (& $checkver -App 'mpv-shinchiro-git' -Dir $bucket -ThrowError *>&1 | Out-String).Trim()
          Write-Host $output

          $successPattern = "(?m)^mpv-shinchiro-git:\s+$([regex]::Escape($manifest.version))\s*$"
          if ($output -notmatch $successPattern) {
              throw "Scoop checkver did not confirm manifest version $($manifest.version)."
          }
